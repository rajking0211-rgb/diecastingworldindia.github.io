<svg xmlns="http://www.w3.org/2000/svg" width="140" height="80" viewBox="0 0 140 80">
  <rect width="140" height="80" fill="#ffffff"/>

  <!-- FADED AUTOMOTIVE TYRE TREAD: DUAL DIRECTIONAL CHEVRONS -->
  <g opacity="0.48">
    <!-- COLUMN 1: UPWARD DIRECTIONAL CHEVRON TRACK (x: 10 to 65) -->
    <g stroke="#cbd5e1" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Longitudinal shoulder tracks -->
      <line x1="12" y1="0" x2="12" y2="80" stroke="#e2e8f0" stroke-width="1.0" stroke-dasharray="5 3"/>
      <line x1="63" y1="0" x2="63" y2="80" stroke="#e2e8f0" stroke-width="1.0" stroke-dasharray="5 3"/>
      <!-- Center channel rib -->
      <line x1="37.5" y1="0" x2="37.5" y2="80" stroke="#cbd5e1" stroke-width="1.6"/>

      <!-- Upward pointing chevrons (repeating every 16px) -->
      <path d="M14 16 L35 4 M61 16 L40 4"/>
      <path d="M14 32 L35 20 M61 32 L40 20"/>
      <path d="M14 48 L35 36 M61 48 L40 36"/>
      <path d="M14 64 L35 52 M61 64 L40 52"/>
      <path d="M14 80 L35 68 M61 80 L40 68"/>
      <path d="M14 96 L35 84 M61 96 L40 84"/>
      <path d="M14 0 L35 -12 M61 0 L40 -12"/>
    </g>

    <!-- Intermediate secondary sipes for Column 1 -->
    <g stroke="#e2e8f0" stroke-width="1.0" stroke-linecap="round" fill="none">
      <path d="M16 22 L33 12 M59 22 L42 12"/>
      <path d="M16 38 L33 28 M59 38 L42 28"/>
      <path d="M16 54 L33 44 M59 54 L42 44"/>
      <path d="M16 70 L33 60 M59 70 L42 60"/>
      <path d="M16 86 L33 76 M59 86 L42 76"/>
      <path d="M16 6 L33 -4 M59 6 L42 -4"/>
      <!-- Shoulder lugs -->
      <line x1="8" y1="16" x2="12" y2="16"/>
      <line x1="8" y1="32" x2="12" y2="32"/>
      <line x1="8" y1="48" x2="12" y2="48"/>
      <line x1="8" y1="64" x2="12" y2="64"/>
      <line x1="8" y1="80" x2="12" y2="80"/>
      <line x1="63" y1="16" x2="67" y2="16"/>
      <line x1="63" y1="32" x2="67" y2="32"/>
      <line x1="63" y1="48" x2="67" y2="48"/>
      <line x1="63" y1="64" x2="67" y2="64"/>
      <line x1="63" y1="80" x2="67" y2="80"/>
    </g>

    <!-- COLUMN 2: DOWNWARD DIRECTIONAL CHEVRON TRACK (x: 75 to 130) -->
    <g stroke="#cbd5e1" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Longitudinal shoulder tracks -->
      <line x1="77" y1="0" x2="77" y2="80" stroke="#e2e8f0" stroke-width="1.0" stroke-dasharray="5 3"/>
      <line x1="128" y1="0" x2="128" y2="80" stroke="#e2e8f0" stroke-width="1.0" stroke-dasharray="5 3"/>
      <!-- Center channel rib -->
      <line x1="102.5" y1="0" x2="102.5" y2="80" stroke="#cbd5e1" stroke-width="1.6"/>

      <!-- Downward pointing chevrons (repeating every 16px) -->
      <path d="M79 4 L100 16 M126 4 L105 16"/>
      <path d="M79 20 L100 32 M126 20 L105 32"/>
      <path d="M79 36 L100 48 M126 36 L105 48"/>
      <path d="M79 52 L100 64 M126 52 L105 64"/>
      <path d="M79 68 L100 80 M126 68 L105 80"/>
      <path d="M79 -12 L100 0 M126 -12 L105 0"/>
      <path d="M79 84 L100 96 M126 84 L105 96"/>
    </g>

    <!-- Intermediate secondary sipes for Column 2 -->
    <g stroke="#e2e8f0" stroke-width="1.0" stroke-linecap="round" fill="none">
      <path d="M81 12 L98 22 M124 12 L107 22"/>
      <path d="M81 28 L98 38 M124 28 L107 38"/>
      <path d="M81 44 L98 54 M124 44 L107 54"/>
      <path d="M81 60 L98 70 M124 60 L107 70"/>
      <path d="M81 76 L98 86 M124 76 L107 86"/>
      <path d="M81 -4 L98 6 M124 -4 L107 6"/>
      <!-- Shoulder lugs -->
      <line x1="73" y1="16" x2="77" y2="16"/>
      <line x1="73" y1="32" x2="77" y2="32"/>
      <line x1="73" y1="48" x2="77" y2="48"/>
      <line x1="73" y1="64" x2="77" y2="64"/>
      <line x1="73" y1="80" x2="77" y2="80"/>
      <line x1="128" y1="16" x2="132" y2="16"/>
      <line x1="128" y1="32" x2="132" y2="32"/>
      <line x1="128" y1="48" x2="132" y2="48"/>
      <line x1="128" y1="64" x2="132" y2="64"/>
      <line x1="128" y1="80" x2="132" y2="80"/>
    </g>
  </g>
</svg>